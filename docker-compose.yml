# Quarterline PostgreSQL 16 + pgvector profile (SPEC §15, §29 `make test-postgres`).
#
# The credentials below are LOCAL DEVELOPMENT DEFAULTS ONLY — the database binds
# to 127.0.0.1 and holds only locally-ingested fixture/demo data. Never reuse
# them for any hosted or multi-user deployment (SPEC §28: authn/authz and
# multi-user isolation are explicitly out of scope for this release).
#
# Start:   docker compose up -d quarterline-db
# Test:    make test-postgres
# Connect: DATABASE_URL=postgresql://quarterline:quarterline@127.0.0.1:5432/quarterline

services:
  quarterline-db:
    image: pgvector/pgvector:pg16
    container_name: quarterline-db
    environment:
      POSTGRES_USER: quarterline
      POSTGRES_PASSWORD: quarterline
      POSTGRES_DB: quarterline
      # Local dev only: no TLS between the app and a loopback-bound container.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - quarterline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarterline -d quarterline"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  quarterline:
    # The app itself, on the pgvector profile. `docker compose up -d` brings up
    # db + app + Prometheus + Grafana; `docker compose up -d quarterline-db`
    # still starts the database alone for `make test-postgres`.
    build:
      context: .
      dockerfile: Dockerfile
    image: quarterline:local
    container_name: quarterline
    depends_on:
      quarterline-db:
        condition: service_healthy
    environment:
      APP_ENV: docker
      HOST: 0.0.0.0
      PORT: "8000"
      STORAGE_DIR: /app/storage
      DATABASE_URL: postgresql+psycopg://quarterline:quarterline@quarterline-db:5432/quarterline
      # Ollama runs on the host, not in this network.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Live SEC calls are refused while this is the placeholder (by design).
      EDGAR_IDENTITY: ${EDGAR_IDENTITY:-Quarterline your-real-contact@email.example}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Migrations run before the server every start: the container is the unit
    # of deployment, so it owns getting its own schema current.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "quarterline db upgrade && exec quarterline serve --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - quarterline-storage:/app/storage
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: quarterline-prometheus
    depends_on:
      - quarterline
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - quarterline-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: quarterline-grafana
    depends_on:
      - prometheus
    environment:
      # Local dev only: anonymous viewer access so the dashboard opens without
      # a login. Never do this on anything reachable beyond loopback.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-quarterline}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - quarterline-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  quarterline-pgdata:
  quarterline-storage:
  quarterline-prometheus-data:
  quarterline-grafana-data:
