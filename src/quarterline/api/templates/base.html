<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title | default("Quarterline") }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <header class="site-header">
    <nav>
      <a class="brand" href="/">Quarterline</a>
      <a href="/screener">Watchlist</a>
    </nav>
  </header>
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Research and education only. Not investment advice.</p>
  </footer>
</body>
</html>
