# Scrapes the Quarterline app's /metrics endpoint (SPEC §24 aggregates).
#
# These are DB-derived aggregates recomputed on every scrape, not process
# counters: they describe the run history the app has persisted, so they stay
# correct across restarts and are meaningful at n=1. Rates are absent (not
# zero) until they have samples — `*_samples` tells you the n behind each one.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: quarterline
    metrics_path: /metrics
    static_configs:
      - targets: ["quarterline:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
